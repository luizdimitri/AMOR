<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Uma Missão do Amor 💖</title>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: linear-gradient(135deg, #2b091c 0%, #591137 50%, #8f1d58 100%);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 12px;
    }

    /* Tela Inicial */
    #start-screen {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, #701644, #240515);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      z-index: 100;
    }

    #start-screen h1 {
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: 2.1rem;
      color: #ff85c0;
      text-shadow: 0 0 20px rgba(255, 105, 180, 0.85);
      margin-bottom: 16px;
      letter-spacing: 1px;
    }

    #start-screen p {
      font-size: 0.98rem;
      font-weight: 600;
      color: #ffd6e7;
      max-width: 440px;
      margin-bottom: 30px;
      line-height: 1.6;
    }

    .btn-pink {
      background: linear-gradient(90deg, #ff2a85, #ff69b4);
      border: none;
      color: white;
      padding: 18px 36px;
      font-size: 1.1rem;
      font-weight: 800;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 25px rgba(255, 42, 133, 0.65);
      transition: transform 0.15s;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      z-index: 101;
    }

    .btn-pink:active {
      transform: scale(0.95);
    }

    /* Player estilo YouTube compacto */
    #player-container {
      display: none;
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 520px;
      z-index: 90;
    }

    .yt-music-box {
      width: 100%;
      background: rgba(36, 12, 26, 0.94);
      border: 1px solid rgba(255, 133, 192, 0.35);
      border-radius: 18px;
      padding: 8px 12px 10px 12px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
    }

    .yt-music-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: #ff85c0;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .yt-iframe-wrapper {
      width: 100%;
      height: 74px;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
    }

    .yt-iframe-wrapper iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Área do Jogo */
    #game-wrapper {
      display: none;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 800px;
      margin-top: 112px;
      user-select: none;
      -webkit-user-select: none;
    }

    #hud {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(8px);
      padding: 10px 18px;
      border-radius: 16px;
      margin-bottom: 10px;
      border: 1px solid rgba(255, 182, 193, 0.3);
      font-weight: 600;
      font-size: 0.95rem;
    }

    .hud-badge {
      background: #ff2a85;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
    }

    canvas {
      background: linear-gradient(180deg, #1d0818 0%, #3a1030 78%, #280a20 78%, #1a0514 100%);
      border: 3px solid #ff69b4;
      border-radius: 18px;
      box-shadow: 0 0 30px rgba(255, 105, 180, 0.45);
      width: 100%;
      max-width: 800px;
      height: auto;
      aspect-ratio: 16 / 9;
      display: block;
    }

    /* Controles Mobile */
    #mobile-controls {
      display: flex;
      justify-content: space-between;
      width: 100%;
      margin-top: 12px;
      gap: 10px;
    }

    .ctrl-group {
      display: flex;
      gap: 10px;
    }

    .ctrl-btn {
      background: rgba(255, 105, 180, 0.25);
      border: 2px solid #ff85c0;
      color: white;
      font-size: 1.3rem;
      font-weight: bold;
      width: 64px;
      height: 58px;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
